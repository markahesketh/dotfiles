onboarding = false

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[theme]
name = "catppuccin-latte"
auto_switch = false

[ui.toast]
delivery = "system"

[experimental]
switch_ascii_input_source_in_prefix = true

[keys]
prefix = "ctrl+space"
goto = "prefix+p"
new_tab = "prefix+t"
next_tab = "prefix+{"
previous_tab = "prefix+}"
focus_pane_right = "prefix+right"
focus_pane_left = "prefix+left"
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"
split_horizontal = "prefix+-"
split_vertical = "prefix+\\"

[[keys.command]]
key = "prefix+0"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+r"
type = "pane"
command = "wt step dev"
description = "start dev server"

[[keys.command]]
key = "prefix+o"
type = "pane"
command = "wt step open"
description = "open in browser"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+g"
type = "shell"
command = "gh pr view --web"
description = "open PR in browser"
